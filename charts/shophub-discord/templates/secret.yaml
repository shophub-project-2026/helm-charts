{{- if .Values.discord.webhookUrl -}}
# Rendered only when the webhook URL is passed at install time
# (--set discord.webhookUrl=...). When empty, the Secret named in
# .Values.discord.secret.name must be created out-of-band so the credential
# never enters git history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.discord.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub-discord.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.discord.secret.key }}: {{ .Values.discord.webhookUrl | quote }}
{{- end }}
