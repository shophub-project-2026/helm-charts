# Container image for the operator manager.
image:
  repository: milos2002/shop-operator
  tag: development
  # Always for the mutable :development tag so a rollout picks up the latest
  # CI build. Override to IfNotPresent for unique local-<ts> tags (deploy-local).
  pullPolicy: Always

# Number of operator manager replicas. Use 1 unless leader election is enabled.
replicaCount: 1

# Default shop image to be deployed by this operator
defaultShopImage: milos2002/shop:development

# JSON-RPC endpoint the Wallet controller uses for on-chain balance lookups.
# Empty uses the operator's built-in default (Ethereum Sepolia via publicnode).
ethRpcUrl: ""

# Operator container resource requests and limits.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  # Create a ServiceAccount for the operator. If false, the chart uses
  # an existing ServiceAccount specified by .Values.serviceAccount.name.
  create: true
  # Override the ServiceAccount name (defaults to the chart fullname).
  name: ""

rbac:
  # Create the ClusterRole and ClusterRoleBinding the operator needs to
  # watch CRDs cluster-wide and reconcile owned objects in any namespace.
  create: true

# Discord bot used by the DiscordChannel controller to provision a dedicated
# channel + webhook per shop (spec §3.1/§4.1). The bot must be invited to the
# guild with the Manage Channels and Manage Webhooks permissions.
#
# Leave guildId empty to disable bot-driven creation — the operator still runs
# and the manual webhookUrl override on a DiscordChannel keeps working.
#
# The bot token is read from an existing Secret you create out-of-band so the
# token is never committed to git (see kube-state shop-operator-discord-secret).
discord:
  guildId: ""
  botToken:
    # Name of an existing Secret holding the bot token. Empty disables the env.
    secretName: ""
    secretKey: bot-token

# Standard scheduling knobs.
nodeSelector: {}
tolerations: []
affinity: {}

# Optional pod-level configuration.
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
