{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shop-operator.fullname" . }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
rules:
  # Shop CRDs the operator owns and reconciles.
  - apiGroups: ["shop.devops.io"]
    resources: ["shops", "discordchannels", "wallets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["shop.devops.io"]
    resources: ["shops/status", "discordchannels/status", "wallets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["shop.devops.io"]
    resources: ["shops/finalizers", "discordchannels/finalizers", "wallets/finalizers"]
    verbs: ["update"]
  # Workloads owned by the Shop reconciler.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # StatefulSets are created by the Redis operator for database=light shops;
  # the reconciler reads their status to gate the shop deployment on readiness.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CNPG creates the application Secret with database credentials — operator must read it
  # to wire env vars into the Shop Deployment, and watch it to react on rotation.
  # The operator also creates a per-shop Secret holding the Discord webhook used
  # by the shop's AlertmanagerConfig.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-shop Grafana dashboards are shipped as ConfigMaps (grafana_dashboard=1).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-shop observability: alert rules and Discord routing.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "alertmanagerconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # External database operator CRDs: CNPG (standard) and the OT-Container-Kit
  # Redis operator (light).
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redis"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Required by controller-runtime for leader election and event recording.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shop-operator.fullname" . }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shop-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "shop-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
