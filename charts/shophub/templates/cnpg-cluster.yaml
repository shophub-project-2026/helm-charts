{{- if .Values.database.cnpg.enabled -}}
# ShopHub's control-plane database, provisioned through the CloudNativePG
# operator — the same operator that backs per-shop `standard` databases. CNPG
# bootstraps the application database/role and publishes credentials in the
# Secret <clusterName>-app (keys: host, port, dbname, username, password),
# which the deployment consumes via secretKeyRef.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.database.cnpg.clusterName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.cnpg.instances }}
  bootstrap:
    initdb:
      database: {{ .Values.database.cnpg.databaseName }}
      owner: {{ .Values.database.cnpg.owner }}
  storage:
    size: {{ .Values.database.cnpg.storageSize }}
{{- end }}
