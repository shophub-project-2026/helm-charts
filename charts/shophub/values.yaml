image:
  repository: milos2002/shophub
  tag: ""
  # Always for the mutable :development tag so a rollout picks up the latest
  # CI build. Override to IfNotPresent for unique local-<ts> tags (deploy-local).
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: shophub.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

config:
  httpPort: "8080"
  jwtSecret: "change-me-in-production"
  db:
    host: "postgresql"
    port: "5432"
    name: "shophub_db"
    user: "shophub_user"
    password: "shophub_password"
  kubeconfig: ""

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

# Set prometheus-stack.enabled: true to install kube-prometheus-stack as a subchart.
prometheus-stack:
  enabled: false

nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
