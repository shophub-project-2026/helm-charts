image:
  repository: milos2002/shophub
  tag: ""
  # Always for the mutable :development tag so a rollout picks up the latest
  # CI build. Override to IfNotPresent for unique local-<ts> tags (deploy-local).
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: shophub.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

config:
  httpPort: "8080"
  jwtSecret: "change-me-in-production"
  # Static database connection values. Ignored when database.cnpg.enabled is
  # true — the app then reads credentials from the CNPG-generated app Secret.
  db:
    host: "postgresql"
    port: "5432"
    name: "shophub_db"
    user: "shophub_user"
    password: "shophub_password"
  kubeconfig: ""

# ShopHub's own PostgreSQL, deployed through the CloudNativePG operator CRD —
# the same operator that provisions per-shop databases (spec §1.2 napomena:
# databases are deployed via their operators). When enabled the chart renders
# a postgresql.cnpg.io/v1 Cluster and wires the app to the credentials CNPG
# publishes in the Secret <clusterName>-app; config.db.* is then ignored.
# Requires the CNPG operator to be installed in the cluster.
database:
  cnpg:
    enabled: false
    clusterName: shophub-db
    instances: 1
    storageSize: 1Gi
    databaseName: shophub_db
    owner: shophub_user

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

# Set prometheus-stack.enabled: true to install kube-prometheus-stack as a subchart.
prometheus-stack:
  enabled: false

nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
