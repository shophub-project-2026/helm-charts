name: Release charts (OCI)

# Publishes every chart under charts/ to the GitHub Container Registry as OCI
# artifacts (spec §5.3: kube-state references charts by their OCI name):
#   oci://ghcr.io/shophub-project-2026/charts/<chart-name>:<chart-version>
#
# GHCR is used instead of Docker Hub because Docker Hub has a flat
# <namespace>/<repo> layout — a chart named shop-operator would collide with
# the milos2002/shop-operator container image repository.
on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch: {}

env:
  OCI_REGISTRY: ghcr.io
  OCI_REPO_PREFIX: ${{ github.repository_owner }}/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "$OCI_REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Package and push charts
        run: |
          set -euo pipefail
          mkdir -p dist
          for chart in charts/*/; do
            name="$(basename "$chart")"
            echo "::group::$name"
            # Vendored dependency archives (charts/*.tgz) are committed, so
            # dependency build works without network access to chart repos.
            helm dependency build "$chart" || true
            helm package "$chart" --destination dist
            version="$(helm show chart "$chart" | awk '/^version:/ {print $2}')"
            helm push "dist/${name}-${version}.tgz" "oci://${OCI_REGISTRY}/${OCI_REPO_PREFIX}"
            echo "::endgroup::"
          done
